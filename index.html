<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="日文Go">
<meta name="application-name" content="日文Go">
<meta name="theme-color" content="#2D6A4F">
<title>日文Go</title>
<link rel="manifest" href="data:application/json;charset=utf-8,%7B%22name%22%3A%22%E6%97%A5%E6%96%87Go%22%2C%22short_name%22%3A%22%E6%97%A5%E6%96%87Go%22%2C%22start_url%22%3A%22.%22%2C%22display%22%3A%22standalone%22%2C%22background_color%22%3A%22%232D6A4F%22%2C%22theme_color%22%3A%22%232D6A4F%22%2C%22icons%22%3A%5B%7B%22src%22%3A%22icon.png%22%2C%22sizes%22%3A%22512x512%22%2C%22type%22%3A%22image%2Fpng%22%7D%5D%7D">
<link rel="apple-touch-icon" href="icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500&family=Noto+Serif+JP:wght@400;600&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{
  --bg:#FAFAF8;--surface:#FFFFFF;--surface2:#F3F2EE;--border:#E8E6E0;
  --text:#1A1A18;--text2:#6B6A64;--text3:#9B9A94;
  --accent:#2D6A4F;--accent-light:#E8F5EE;--accent-text:#1B4332;
  --kata:#1A5276;--kata-light:#EBF5FB;--kata-text:#0D2E45;
  --danger:#C0392B;--danger-light:#FDECEA;
  --radius:12px;--radius-sm:8px;
}
body{font-family:'Noto Sans TC',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;max-width:480px;margin:0 auto;}
.app-header{background:var(--surface);border-bottom:1px solid var(--border);padding:14px 20px 0;position:sticky;top:0;z-index:100;}
.app-title{font-size:17px;font-weight:500;font-family:'Noto Serif JP',serif;margin-bottom:12px;display:flex;align-items:center;gap:8px;}
.app-title span{font-size:12px;font-weight:400;color:var(--text2);font-family:'Noto Sans TC',sans-serif;}
.mode-row{display:flex;gap:6px;margin-bottom:10px;}
.mode-btn{flex:1;padding:6px 0;font-size:12px;border:1px solid var(--border);border-radius:20px;background:var(--surface2);color:var(--text2);cursor:pointer;font-family:'Noto Serif JP',serif;}
.mode-btn.active-hira{background:var(--accent-light);border-color:var(--accent);color:var(--accent-text);font-weight:500;}
.mode-btn.active-kata{background:var(--kata-light);border-color:var(--kata);color:var(--kata-text);font-weight:500;}
.tab-nav{display:flex;}
.tab-btn{flex:1;padding:9px 0;font-size:13px;font-family:'Noto Sans TC',sans-serif;border:none;background:transparent;color:var(--text3);cursor:pointer;border-bottom:2px solid transparent;transition:all .2s;}
.tab-btn.active{color:var(--accent);border-bottom-color:var(--accent);font-weight:500;}
.tab-content{display:none;padding:14px 14px 80px}
.tab-content.active{display:block}

/* 詳細卡片 */
.detail-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:16px;margin-bottom:14px;}
.detail-top{display:flex;align-items:center;gap:16px;margin-bottom:12px;}
.big-char{font-family:'Noto Serif JP',serif;font-size:72px;line-height:1;color:var(--text);min-width:80px;text-align:center;}
.detail-info{flex:1;}
.detail-rom{font-size:26px;font-weight:500;color:var(--accent);letter-spacing:0.05em;font-family:'Noto Serif JP',serif;}
.detail-rom.kata{color:var(--kata);}
.detail-tip{font-size:12px;color:var(--text2);margin-top:5px;line-height:1.5;}
.words-row{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px;}
.word-chip{background:var(--surface2);border:1px solid var(--border);border-radius:8px;padding:6px 10px;cursor:pointer;transition:background .15s;}
.word-chip:active{background:var(--border);}
.word-jp{font-family:'Noto Serif JP',serif;font-size:15px;color:var(--text);}
.word-meaning{font-size:11px;color:var(--text3);margin-top:2px;}
.speak-btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;padding:11px;background:var(--accent-light);border:1px solid var(--accent);border-radius:var(--radius-sm);color:var(--accent-text);font-size:14px;font-family:'Noto Sans TC',sans-serif;cursor:pointer;}
.speak-btn.kata{background:var(--kata-light);border-color:var(--kata);color:var(--kata-text);}
.speak-btn:active{opacity:.8;}

.clear-btn{font-size:11px;color:var(--text3);background:none;border:1px solid var(--border);border-radius:6px;padding:3px 8px;cursor:pointer;}

/* 格線 */
.row-label{font-size:11px;color:var(--text3);font-weight:500;margin:12px 0 5px;padding-left:2px;}
.kana-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:5px;margin-bottom:4px;}
.kana-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-sm);padding:9px 4px;text-align:center;cursor:pointer;transition:all .15s;min-height:54px;display:flex;flex-direction:column;align-items:center;justify-content:center;}
.kana-card:active{transform:scale(0.95)}
.kana-card.learned{background:var(--accent-light);border-color:var(--accent);}
.kana-card.learned-kata{background:var(--kata-light);border-color:var(--kata);}
.kana-card.sel{background:var(--surface2);border-color:var(--text2);}
.kana-char{font-family:'Noto Serif JP',serif;font-size:22px;color:var(--text);line-height:1.2;}
.kana-card.learned .kana-char{color:var(--accent-text);}
.kana-card.learned-kata .kana-char{color:var(--kata-text);}
.kana-rom{font-size:10px;color:var(--text3);margin-top:1px;}
.kana-empty{background:transparent!important;border-color:transparent!important;cursor:default;}

/* 測驗 */
.quiz-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:20px;text-align:center;margin-bottom:12px;}
.quiz-mode-row{display:flex;gap:6px;margin-bottom:14px;}
.quiz-mode-btn{flex:1;padding:7px;font-size:12px;border:1px solid var(--border);border-radius:8px;background:var(--surface2);color:var(--text2);cursor:pointer;}
.quiz-mode-btn.on{background:var(--accent-light);border-color:var(--accent);color:var(--accent-text);font-weight:500;}
.quiz-char{font-family:'Noto Serif JP',serif;font-size:68px;color:var(--text);line-height:1;margin-bottom:18px;}
.quiz-opts{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
.quiz-opt{padding:13px;border:1px solid var(--border);border-radius:var(--radius-sm);background:var(--surface2);font-size:14px;font-family:'Noto Serif JP',serif;cursor:pointer;color:var(--text);transition:all .15s;}
.quiz-opt:active{transform:scale(0.97)}
.quiz-opt.correct{background:var(--accent-light);border-color:var(--accent);color:var(--accent-text);}
.quiz-opt.wrong{background:var(--danger-light);border-color:var(--danger);color:var(--danger);}
.quiz-feedback{font-size:13px;color:var(--text2);margin-top:12px;min-height:18px;line-height:1.5;}
.next-btn{width:100%;padding:13px;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-sm);font-size:14px;font-family:'Noto Sans TC',sans-serif;color:var(--text);cursor:pointer;}
.next-btn:active{background:var(--surface2);}

/* 進度 */
.stats-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-bottom:14px;}
.stat-box{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-sm);padding:12px 8px;text-align:center;}
.stat-num{font-size:22px;font-weight:500;color:var(--text);}
.stat-lbl{font-size:10px;color:var(--text3);margin-top:3px;}
.section-title{font-size:12px;color:var(--text3);margin:14px 0 6px;}
.progress-track{height:5px;background:var(--surface2);border-radius:3px;overflow:hidden;margin-bottom:5px;}
.progress-fill{height:100%;border-radius:3px;transition:width .4s ease;}
.progress-fill.hira{background:var(--accent);}
.progress-fill.kata{background:var(--kata);}
.progress-label{font-size:11px;color:var(--text3);margin-bottom:14px;}
.action-btn{display:block;width:100%;padding:13px;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-sm);font-size:14px;font-family:'Noto Sans TC',sans-serif;color:var(--text);cursor:pointer;text-align:center;margin-bottom:8px;}
.action-btn.danger{color:var(--danger);border-color:#F5C6C2;}
.safe-area{height:env(safe-area-inset-bottom,20px);}
</style>
</head>
<body>
<div class="app-header">
  <div class="app-title">日文Go <span>五十音學習</span></div>
  <div class="mode-row">
    <button class="mode-btn active-hira" id="mode-hira" onclick="setMode('hira')">ひらがな　平假名</button>
    <button class="mode-btn" id="mode-kata" onclick="setMode('kata')">カタカナ　片假名</button>
  </div>
  <nav class="tab-nav">
    <button class="tab-btn active" onclick="setTab('learn')">學習</button>
    <button class="tab-btn" onclick="setTab('quiz')">測驗</button>
    <button class="tab-btn" onclick="setTab('stats')">進度</button>
  </nav>
</div>

<!-- 學習頁 -->
<div class="tab-content active" id="tab-learn">
  <div class="detail-card">
    <div class="detail-top">
      <div class="big-char" id="d-char">あ</div>
      <div class="detail-info">
        <div class="detail-rom" id="d-rom">a</div>
        <div class="detail-tip" id="d-tip">嘴巴張開，發「啊」的音</div>
      </div>
    </div>
    <div class="words-row" id="d-words"></div>
    <button class="speak-btn" id="speak-btn" onclick="speak(currentChar)">♪ 朗讀發音</button>
  </div>

  <div id="kana-rows"></div>
</div>

<!-- 測驗頁 -->
<div class="tab-content" id="tab-quiz">
  <div class="quiz-card">
    <div class="quiz-mode-row">
      <button class="quiz-mode-btn on" id="qm-hira" onclick="setQuizMode('hira')">平假名</button>
      <button class="quiz-mode-btn" id="qm-kata" onclick="setQuizMode('kata')">片假名</button>
      <button class="quiz-mode-btn" id="qm-both" onclick="setQuizMode('both')">混合</button>
    </div>
    <div class="quiz-char" id="q-char">あ</div>
    <div class="quiz-opts" id="q-opts"></div>
    <div class="quiz-feedback" id="q-feedback"></div>
  </div>
  <button class="next-btn" onclick="nextQuiz()">下一題 →</button>
</div>

<!-- 進度頁 -->
<div class="tab-content" id="tab-stats">
  <div class="stats-grid">
    <div class="stat-box"><div class="stat-num" id="s-learned">0</div><div class="stat-lbl">已學習</div></div>
    <div class="stat-box"><div class="stat-num">92</div><div class="stat-lbl">總假名</div></div>
    <div class="stat-box"><div class="stat-num" id="s-correct">0</div><div class="stat-lbl">答對次數</div></div>
  </div>
  <div class="section-title">平假名進度</div>
  <div class="progress-track"><div class="progress-fill hira" id="prog-hira" style="width:0%"></div></div>
  <div class="progress-label" id="prog-hira-label">0 / 46</div>
  <div class="section-title">片假名進度</div>
  <div class="progress-track"><div class="progress-fill kata" id="prog-kata" style="width:0%"></div></div>
  <div class="progress-label" id="prog-kata-label">0 / 46</div>
  <button class="action-btn danger" onclick="resetProgress()">重置所有進度</button>
</div>
<!-- 手寫抽屜 -->
<div id="drawer-overlay" onclick="closeDrawer()" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,0.2);z-index:200;"></div>
<div id="write-drawer" style="position:fixed;bottom:0;left:50%;transform:translateX(-50%) translateY(100%);width:100%;max-width:480px;background:var(--surface);border-radius:16px 16px 0 0;border-top:1px solid var(--border);padding:0 16px 0;z-index:201;transition:transform .3s ease;box-shadow:0 -4px 20px rgba(0,0,0,0.1);">
  <div style="display:flex;align-items:center;justify-content:space-between;padding:12px 0 10px;">
    <div style="display:flex;align-items:center;gap:10px;">
      <span style="font-size:13px;color:var(--text2);">✏️ 手寫練習</span>
      <span id="drawer-char" style="font-family:'Noto Serif JP',serif;font-size:22px;color:var(--text);">あ</span>
    </div>
    <div style="display:flex;gap:8px;align-items:center;">
      <button class="clear-btn" onclick="clearCanvas()">清除</button>
      <button onclick="closeDrawer()" style="font-size:13px;color:var(--text3);background:none;border:none;padding:4px 8px;cursor:pointer;">✕</button>
    </div>
  </div>
  <canvas id="write-canvas" style="display:block;width:100%;height:200px;background:#FAFAF8;border:1px solid var(--border);border-radius:8px;touch-action:none;cursor:crosshair;margin-bottom:12px;"></canvas>
  <div id="write-hint" style="font-size:11px;color:var(--text3);text-align:center;padding-bottom:16px;"></div>
</div>

<!-- 練習按鈕（固定底部） -->
<div id="practice-bar" style="position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;background:var(--surface);border-top:1px solid var(--border);padding:10px 16px;padding-bottom:calc(10px + env(safe-area-inset-bottom));z-index:199;display:none;">
  <button onclick="openDrawer()" style="width:100%;padding:11px;background:var(--accent-light);border:1px solid var(--accent);border-radius:var(--radius-sm);color:var(--accent-text);font-size:14px;font-family:'Noto Sans TC',sans-serif;cursor:pointer;">✏️ 練習寫「<span id="bar-char">あ</span>」</button>
</div>

<div class="safe-area"></div>

// ── 狀態 ──────────────────────────────────────────────
let mode = 'hira';
let currentChar = 'あ';
let currentWords = [];
let learnedHira = new Set(JSON.parse(localStorage.getItem('lh')||'[]'));
let learnedKata = new Set(JSON.parse(localStorage.getItem('lk')||'[]'));
let correctCount = parseInt(localStorage.getItem('correct')||'0');
let quizAnswered = false;
let quizMode = 'hira';

function saveProgress(){
  localStorage.setItem('lh', JSON.stringify([...learnedHira]));
  localStorage.setItem('lk', JSON.stringify([...learnedKata]));
  localStorage.setItem('correct', correctCount);
}

// ── 模式切換 ──────────────────────────────────────────
function setMode(m){
  mode = m;
  document.getElementById('mode-hira').className = 'mode-btn' + (m==='hira'?' active-hira':'');
  document.getElementById('mode-kata').className = 'mode-btn' + (m==='kata'?' active-kata':'');
  document.getElementById('speak-btn').className = 'speak-btn' + (m==='kata'?' kata':'');
  document.getElementById('d-rom').className = 'detail-rom' + (m==='kata'?' kata':'');
  document.getElementById('kana-rows').innerHTML = '';
  buildGrids();
  const firstRow = m==='hira' ? HIRA_ROWS : KATA_ROWS;
  const first = firstRow[0].items.find(Boolean);
  if(first) selectKana(first);
}

// ── 格子建構 ──────────────────────────────────────────
function buildGrids(){
  const rows = mode==='hira' ? HIRA_ROWS : KATA_ROWS;
  const container = document.getElementById('kana-rows');
  rows.forEach(row=>{
    const lbl = document.createElement('div');
    lbl.className='row-label';
    lbl.textContent=row.label;
    container.appendChild(lbl);
    const grid = document.createElement('div');
    grid.className='kana-grid';
    row.items.forEach(item=>{
      const card = document.createElement('div');
      if(!item){
        card.className='kana-card kana-empty';
      } else {
        const isLearned = mode==='hira' ? learnedHira.has(item.c) : learnedKata.has(item.c);
        const learnedClass = mode==='hira' ? 'learned' : 'learned-kata';
        card.className='kana-card'+(isLearned?' '+learnedClass:'')+(item.c===currentChar?' sel':'');
        card.id='card-'+item.c;
        card.innerHTML=`<div class="kana-char">${item.c}</div><div class="kana-rom">${item.r}</div>`;
        card.onclick=()=>selectKana(item);
      }
      grid.appendChild(card);
    });
    container.appendChild(grid);
  });
}

function selectKana(item){
  document.querySelectorAll('.kana-card.sel').forEach(c=>c.classList.remove('sel'));
  const card = document.getElementById('card-'+item.c);
  if(card){
    card.classList.add('sel');
    const learnedClass = mode==='hira'?'learned':'learned-kata';
    const learnedSet = mode==='hira'?learnedHira:learnedKata;
    if(!learnedSet.has(item.c)){
      learnedSet.add(item.c);
      card.classList.add(learnedClass);
      saveProgress();
    }
  }
  currentChar = item.c;
  currentWords = item.w||[];
  document.getElementById('d-char').textContent = item.c;
  document.getElementById('d-rom').textContent = item.r;
  document.getElementById('d-tip').textContent = item.t;
  document.getElementById('write-hint').textContent = '用手指或滑鼠寫寫看「'+item.c+'」';
  clearCanvas();
  renderWords(item.w||[]);
  speak(item.c);
  // 顯示底部練習按鈕
  document.getElementById('practice-bar').style.display = 'block';
  document.getElementById('bar-char').textContent = item.c;
  document.getElementById('drawer-char').textContent = item.c;
  document.getElementById('write-hint').textContent = '對照左上角「'+item.c+'」，用手指描寫';
}

function openDrawer(){
  document.getElementById('write-drawer').style.transform = 'translateX(-50%) translateY(0)';
  document.getElementById('drawer-overlay').style.display = 'block';
  document.getElementById('practice-bar').style.display = 'none';
  setTimeout(()=>{ if(!canvas) initCanvas(); else { clearCanvas(); } }, 50);
}

function closeDrawer(){
  document.getElementById('write-drawer').style.transform = 'translateX(-50%) translateY(100%)';
  document.getElementById('drawer-overlay').style.display = 'none';
  document.getElementById('practice-bar').style.display = 'block';
}

function renderWords(words){
  const container = document.getElementById('d-words');
  container.innerHTML='';
  words.forEach(w=>{
    const chip = document.createElement('div');
    chip.className='word-chip';
    chip.innerHTML=`<div class="word-jp">${w.j}</div><div class="word-meaning">${w.r} — ${w.m}</div>`;
    chip.onclick=()=>speakText(w.j);
    container.appendChild(chip);
  });
}

// ── 音檔播放 ──────────────────────────────────────────
let _currentAudio = null;
function speak(char){
  if(!char||!char.trim()) return;
  const file = AUDIO_MAP[char];
  if(!file) return;
  if(_currentAudio){_currentAudio.pause();_currentAudio.currentTime=0;_currentAudio=null;}
  const audio = new Audio('audio/'+file+'.mp3');
  _currentAudio = audio;
  audio.play().catch(()=>{});
}
function speakText(text){
  if(!window.speechSynthesis) return;
  const u = new SpeechSynthesisUtterance(text);
  u.lang='ja-JP'; u.rate=0.7;
  speechSynthesis.cancel();
  speechSynthesis.speak(u);
}

// ── 手寫 Canvas ───────────────────────────────────────
let canvas, ctx, isDrawing=false, lastX=0, lastY=0;
function initCanvas(){
  canvas = document.getElementById('write-canvas');
  const dpr = window.devicePixelRatio||1;
  // 強制取得實際寬度
  canvas.style.width = '100%';
  const rect = canvas.getBoundingClientRect();
  canvas.width = (rect.width||320) * dpr;
  canvas.height = 200 * dpr;
  ctx = canvas.getContext('2d');
  ctx.scale(dpr, dpr);
  ctx.strokeStyle = '#1A1A18';
  ctx.lineWidth = 3;
  ctx.lineCap = 'round';
  ctx.lineJoin = 'round';
  drawGuide();

  canvas.addEventListener('mousedown', e=>{isDrawing=true;[lastX,lastY]=getPos(e);});
  canvas.addEventListener('mousemove', e=>{if(isDrawing)draw(e);});
  canvas.addEventListener('mouseup', ()=>isDrawing=false);
  canvas.addEventListener('mouseleave', ()=>isDrawing=false);
  canvas.addEventListener('touchstart', e=>{e.preventDefault();isDrawing=true;[lastX,lastY]=getPos(e.touches[0]);},{passive:false});
  canvas.addEventListener('touchmove', e=>{e.preventDefault();if(isDrawing)draw(e.touches[0]);},{passive:false});
  canvas.addEventListener('touchend', ()=>isDrawing=false);
}
function getPos(e){
  const r=canvas.getBoundingClientRect();
  return [e.clientX-r.left, e.clientY-r.top];
}
function draw(e){
  const [x,y]=getPos(e);
  ctx.beginPath();
  ctx.moveTo(lastX,lastY);
  ctx.lineTo(x,y);
  ctx.stroke();
  [lastX,lastY]=[x,y];
}
function drawGuide(){
  const w=canvas.getBoundingClientRect().width;
  const h=canvas.getBoundingClientRect().height;
  ctx.strokeStyle='#E8E6E0';
  ctx.lineWidth=0.5;
  ctx.setLineDash([4,4]);
  ctx.beginPath();ctx.moveTo(w/2,0);ctx.lineTo(w/2,h);ctx.stroke();
  ctx.beginPath();ctx.moveTo(0,h/2);ctx.lineTo(w,h/2);ctx.stroke();
  ctx.setLineDash([]);
  ctx.strokeStyle='#1A1A18';
  ctx.lineWidth=3;
  // 參考字
  ctx.font='120px serif';
  ctx.fillStyle='rgba(0,0,0,0.06)';
  ctx.textAlign='center';
  ctx.textBaseline='middle';
  ctx.fillText(currentChar, w/2, h/2);
}
function clearCanvas(){
  if(!canvas) return;
  const w=canvas.getBoundingClientRect().width;
  const h=canvas.getBoundingClientRect().height;
  ctx.clearRect(0,0,canvas.width,canvas.height);
  drawGuide();
}

// ── Tab 切換 ──────────────────────────────────────────
function setTab(tab){
  document.querySelectorAll('.tab-content').forEach(el=>{
    el.classList.toggle('active', el.id==='tab-'+tab);
  });
  document.querySelectorAll('.tab-btn').forEach((btn,i)=>{
    btn.classList.toggle('active', ['learn','quiz','stats'][i]===tab);
  });
  if(tab==='quiz') nextQuiz();
  if(tab==='stats') updateStats();
}

// ── 測驗 ──────────────────────────────────────────────
function setQuizMode(m){
  quizMode=m;
  ['hira','kata','both'].forEach(x=>{
    document.getElementById('qm-'+x).classList.toggle('on', x===m);
  });
  nextQuiz();
}

function getQuizPool(){
  if(quizMode==='hira') return HIRA_ROWS.flatMap(r=>r.items).filter(Boolean);
  if(quizMode==='kata') return KATA_ROWS.flatMap(r=>r.items).filter(Boolean);
  return [...HIRA_ROWS.flatMap(r=>r.items).filter(Boolean), ...KATA_ROWS.flatMap(r=>r.items).filter(Boolean)];
}

function nextQuiz(){
  quizAnswered=false;
  document.getElementById('q-feedback').textContent='';
  const pool = getQuizPool();
  const correct = pool[Math.floor(Math.random()*pool.length)];
  document.getElementById('q-char').textContent=correct.c;
  const wrongs = pool.filter(k=>k.r!==correct.r).sort(()=>Math.random()-.5).slice(0,3);
  const opts = [...wrongs, correct].sort(()=>Math.random()-.5);
  const container = document.getElementById('q-opts');
  container.innerHTML='';
  opts.forEach(opt=>{
    const btn = document.createElement('button');
    btn.className='quiz-opt';
    btn.textContent=opt.r;
    btn.onclick=()=>{
      if(quizAnswered) return;
      quizAnswered=true;
      if(opt.r===correct.r){
        btn.classList.add('correct');
        correctCount++;
        saveProgress();
        document.getElementById('q-feedback').textContent='✓ 正確！　'+correct.t;
        const ls = correct.c.charCodeAt(0)>=0x30A0 ? learnedKata : learnedHira;
        if(!ls.has(correct.c)){ls.add(correct.c);saveProgress();}
      } else {
        btn.classList.add('wrong');
        container.querySelectorAll('.quiz-opt').forEach(b=>{if(b.textContent===correct.r)b.classList.add('correct');});
        document.getElementById('q-feedback').textContent='✗ 正確答案是「'+correct.r+'」　'+correct.t;
      }
      speak(correct.c);
    };
    container.appendChild(btn);
  });
}

// ── 進度 ──────────────────────────────────────────────
function updateStats(){
  const lh=learnedHira.size, lk=learnedKata.size;
  document.getElementById('s-learned').textContent=lh+lk;
  document.getElementById('s-correct').textContent=correctCount;
  document.getElementById('prog-hira').style.width=Math.round(lh/46*100)+'%';
  document.getElementById('prog-hira-label').textContent=lh+' / 46（'+Math.round(lh/46*100)+'%）';
  document.getElementById('prog-kata').style.width=Math.round(lk/46*100)+'%';
  document.getElementById('prog-kata-label').textContent=lk+' / 46（'+Math.round(lk/46*100)+'%）';
}

function resetProgress(){
  if(!confirm('確定要重置所有學習進度嗎？')) return;
  learnedHira.clear(); learnedKata.clear(); correctCount=0;
  localStorage.removeItem('lh');localStorage.removeItem('lk');localStorage.removeItem('correct');
  document.querySelectorAll('.kana-card').forEach(c=>c.classList.remove('learned','learned-kata','sel'));
  updateStats();
}

// ── 初始化 ────────────────────────────────────────────
buildGrids();
updateStats();
setTimeout(()=>{
  const first = HIRA_ROWS[0].items[0];
  selectKana(first);
}, 100);
</script>
